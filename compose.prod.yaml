# The server: `docker compose -f compose.prod.yaml up -d`, with a .env next to it (see .env.prod.example).
# Update: `docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d`.
# The server keeps its own copy (with a Makefile for init, update and backup): a change here goes there by hand.
services:
  notes:
    # The name image.yml publishes, ghcr.io/<the GitHub repository>: the CI checks they match.
    image: ghcr.io/cyril-fl/tide:${TIDE_VERSION:-latest}
    container_name: tide-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: tide-postgres
      PORT: 5432
      S3_ENDPOINT: tide-silo:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-notes}
      TIDE_SECRET: ${TIDE_SECRET:?set TIDE_SECRET in .env}
      # The first account, created on an empty base at startup: it manages the others. Inert once one exists.
      TIDE_HOST_NAME: ${TIDE_HOST_NAME:-}
      TIDE_HOST_PASSWORD: ${TIDE_HOST_PASSWORD:-}
      CONFIG_FILE: ""
    # The address the browser types: requests from any other page are refused. Published on 127.0.0.1, only the proxy
    # reaches the API, which then reads the address of each device in X-Forwarded-For.
    command: serve --addr :8080 --web /web --published=${TIDE_LISTEN:-127.0.0.1:8080} --origin=${WEB_ORIGIN:?set WEB_ORIGIN in .env} --add-user-mode=${TIDE_ADD_USER_MODE:-invitation} --mcp-addr :8081 --mcp-published=${TIDE_MCP_LISTEN:-127.0.0.1:8081}
    # Plain HTTP, and the session cookie needs HTTPS: a proxy in front gives it. 8081 serves only /mcp and its OAuth
    # (agents holding an API token or signed in): the one address a tunnel opens to the Internet (MCP.md).
    ports:
      - "${TIDE_LISTEN:-127.0.0.1:8080}:8080"
      - "${TIDE_MCP_LISTEN:-127.0.0.1:8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      silo:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: tide-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: tide-silo
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - silo-data:/data
    restart: unless-stopped

  # The dashboard of the base, as in dev: connect it to tide-postgres:5432 with the POSTGRES_ user. Published on
  # 127.0.0.1 like Notes: reach it through the proxy or an SSH tunnel, never open to the network.
  libredb:
    image: libredb/libredb-studio:latest
    container_name: tide-libredb
    environment:
      ADMIN_EMAIL: ${LIBREDB_ADMIN_EMAIL:-admin@libredb.org}
      ADMIN_PASSWORD: ${LIBREDB_ADMIN_PASSWORD:?set LIBREDB_ADMIN_PASSWORD in .env}
      JWT_SECRET: ${LIBREDB_JWT_SECRET:?set LIBREDB_JWT_SECRET in .env}
      NEXT_PUBLIC_AUTH_PROVIDER: local
      STORAGE_PROVIDER: local
    ports:
      - "${LIBREDB_LISTEN:-127.0.0.1:3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  silo-data:

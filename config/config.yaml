name: "tide"
commands:
  create:
    use: "add"
    short: "Add a new note, folder, tag, or API token"
    example: "{name} add [--note | --folder | --tag] [options]"
  create-note:
    use: "note"
    short: "Add a new note"
    long: "Add a new note. A form opens for the content when --content is not given. The title is the first heading of the content, or its first words. --pin and --lock pin and lock it once created."
    example: "{name} add note --content \"# Ideas\" --tag go,sql\ncat ideas.md | {name} add note --content - --parent /Projects\n{name} add note --content \"# Ideas\" --pin --lock"
    args:
      - name: "content"
        shorthand: "c"
        value: ""
        usage: "Content of the note (- reads it from stdin)"
        type: "string"
      - name: "tag"
        shorthand: ""
        value: ""
        usage: "Tags of the note, comma separated or repeated (unknown tags are created)"
        type: "stringSlice"
      - name: "tag-from-list"
        shorthand: ""
        value: ""
        usage: "Pick tags from the existing ones"
        type: "bool"
      - name: "parent"
        shorthand: "p"
        value: ""
        usage: "UUID or path of the parent folder"
        type: "string"
      - name: "parent-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the parent folder from a list"
        type: "bool"
      - name: "pin"
        shorthand: ""
        value: ""
        usage: "Pin the note"
        type: "bool"
      - name: "lock"
        shorthand: ""
        value: ""
        usage: "Lock the note read-only"
        type: "bool"
  create-folder:
    use: "folder"
    short: "Add a new folder"
    long: "Add a new folder. A form opens for the title when --title is not given."
    example: "{name} add folder --title \"Projects\" --parent /Work"
    args:
      - name: "title"
        shorthand: "t"
        value: ""
        usage: "Title of the folder"
        type: "string"
      - name: "parent"
        shorthand: "p"
        value: ""
        usage: "UUID or path of the parent folder"
        type: "string"
      - name: "parent-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the parent folder from a list"
        type: "bool"
  create-tag:
    use: "tag"
    short: "Add a new tag"
  create-token:
    use: "token <name>"
    short: "Add an API token to the account"
    long: "Create a named API token for scripts and agents, and print it once on stdout: the server keeps only its hash. It acts on the notes, folders, tags and files like the account (Authorization: Bearer <token>), never on the account itself: its tokens, password or settings. It expires after --expires: 7d, 30d, 90d, 1y or never. --read-only refuses it every change, and gives the MCP its reading tools only."
    example: "{name} add token \"script backup\"\n{name} add token \"Claude phone\" --expires 30d\n{name} add token \"reader\" --read-only"
    args:
      - name: "expires"
        shorthand: ""
        value: "90d"
        usage: "How long the token works: 7d, 30d, 90d, 1y or never"
        type: "string"
      - name: "read-only"
        shorthand: ""
        value: ""
        usage: "A token that reads the notes and changes nothing"
        type: "bool"
  read:
    use: "show"
    short: "Show an existing note, folder, or tag, or the API tokens"
  read-note:
    use: "note <uuid|path>..."
    short: "Show existing notes"
    long: "Show the path of a note, its tags, its creation and last change dates and its lock, then its content rendered as markdown; several notes are printed one after the other. --max-chars keeps only the start of each content, cut at a line or word end. --json prints its id, title, path, content, tags, readonly, created_at and updated_at, with length and truncated under --max-chars; several notes give an array. --history lists the versions of its text, latest first, and --version shows one; edit note --restore-version brings one back (the noteHistory feature of the plan)."
    example: "{name} show note <uuid>\n{name} show note /Projects/Go/Ideas --json\n{name} show note /Inbox/A /Inbox/B --max-chars 300 --json\n{name} show note /Projects/Go/Ideas --history\n{name} show note /Projects/Go/Ideas --version <version-uuid>"
    args:
      - name: "history"
        shorthand: ""
        value: ""
        usage: "List the versions of the note, latest first"
        type: "bool"
      - name: "version"
        shorthand: ""
        value: ""
        usage: "Show the text of a version, by its uuid from --history"
        type: "string"
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  read-folder:
    use: "folder <uuid|path>"
    short: "Show an existing folder"
    long: "Show the title and path of a folder (the root without one), then its subfolders and notes, folders first. --limit and --offset page a big folder, the total said. --tags, --length and --preview N add each note's tags, length in characters and first N characters, to the table and to --json."
    example: "{name} show folder <uuid>\n{name} show folder /Projects --json\n{name} show folder /Inbox --tags --length --preview 120 --limit 100 --offset 100 --json"
    args:
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  read-links:
    use: "links [<uuid|path>]"
    short: "List the broken links, or a note's links"
    long: "List the broken links of every note: a [[link]] to no note or to several, a link to a note in the trash, an image or file the account no longer keeps. Each with the path of its note and the link as written. With a note, list its links, its backlinks and the notes sharing its tags, most shared first; --json prints {links, backlinks, neighbors}."
    example: "{name} show links\n{name} show links --json\n{name} show links /Projects/Plan --json"
    args:
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  read-tag:
    use: "tag [<value>]"
    short: "Show an existing tag"
    long: "Show a tag and the notes carrying it, or every tag with --list, or with --similar the groups of tags that differ by a typo, case, accents or a plural, with their note count, to merge with edit tag --merge (--yaml applies to --list and --similar, --json to the three)."
    example: "{name} show tag go\n{name} show tag go --json\n{name} show tag --list --json\n{name} show tag --similar"
    args:
      - name: "list"
        shorthand: "l"
        value: ""
        usage: "List all tags"
        type: "bool"
      - name: "similar"
        shorthand: ""
        value: ""
        usage: "List the groups of close tags with their note count"
        type: "bool"
      - name: "yaml"
        shorthand: ""
        value: ""
        usage: "Display the result as YAML"
        type: "bool"
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  read-token:
    use: "token"
    short: "List the API tokens of the account"
    long: "List the API tokens of the account: name, uuid, creation, last use and expiry. The tokens themselves are never shown again."
    example: "{name} show token\n{name} show token --json"
    args:
      - name: "yaml"
        shorthand: ""
        value: ""
        usage: "Display the result as YAML"
        type: "bool"
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  edit:
    use: "edit"
    short: "Edit an existing note, folder, or tag"
  edit-note:
    use: "note <uuid|path>"
    short: "Edit an existing note"
    long: "Edit an existing note. Without flags, a form opens with the current content. The title follows the first heading of the content, or its first words. --pin or --lock alone leaves the text and its last change date as they are. --title, --replace or --section change one part of the text without sending it whole. A locked note refuses content, tag and text changes until --unlock; the replaced text stays in the history, and --restore-version brings a version back."
    example: "{name} edit note /Projects/Go/Ideas --tag go --untag sql\ncat ideas.md | {name} edit note <uuid> --content -\n{name} edit note /Projects/Go/Ideas --title \"Go ideas\"\n{name} edit note /Projects/Go/Ideas --replace teh --with the --all\n{name} edit note /Projects/Go/Ideas --section Links --with \"- https://go.dev\"\n{name} edit note /Projects/Go/Ideas --pin\n{name} edit note /Projects/Go/Ideas --lock\n{name} edit note /Projects/Go/Ideas --restore-version <version-uuid>"
    args:
      - name: "content"
        shorthand: "c"
        value: ""
        usage: "New content of the note (- reads it from stdin)"
        type: "string"
      - name: "tag"
        shorthand: ""
        value: ""
        usage: "Tags to add, comma separated or repeated (unknown tags are created)"
        type: "stringSlice"
      - name: "max-chars"
        shorthand: ""
        value: "0"
        usage: "Only the start of each content, that many characters at most, 0 for all of it"
        type: "int"
      - name: "untag"
        shorthand: ""
        value: ""
        usage: "Tags to remove, comma separated or repeated"
        type: "stringSlice"
      - name: "tag-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the tags from the existing ones, current ones checked"
        type: "bool"
      - name: "pin"
      - name: "limit"
        shorthand: ""
        value: "0"
        usage: "How many items at most, 0 for all of them"
        type: "int"
      - name: "offset"
        shorthand: ""
        value: "0"
        usage: "Items skipped before the first shown"
        type: "int"
      - name: "tags"
        shorthand: ""
        value: ""
        usage: "Add each note's tags"
        type: "bool"
      - name: "length"
        shorthand: ""
        value: ""
        usage: "Add each note's length in characters"
        type: "bool"
      - name: "preview"
        shorthand: ""
        value: "0"
        usage: "Add each note's first N characters"
        type: "int"
        shorthand: ""
        value: ""
        usage: "Pin the note"
        type: "bool"
      - name: "unpin"
        shorthand: ""
        value: ""
        usage: "Unpin the note"
        type: "bool"
      - name: "lock"
        shorthand: ""
        value: ""
        usage: "Lock the note read-only"
        type: "bool"
      - name: "unlock"
        shorthand: ""
        value: ""
        usage: "Unlock the note"
        type: "bool"
      - name: "title"
        shorthand: "t"
        value: ""
        usage: "New title: the first heading takes it, links to the note follow"
        type: "string"
      - name: "replace"
        shorthand: ""
        value: ""
        usage: "Exact text to replace with --with, found once (or every time with --all)"
        type: "string"
      - name: "section"
        shorthand: ""
        value: ""
        usage: "Heading whose body --with replaces, down to the next heading of its level or higher"
        type: "string"
      - name: "with"
        shorthand: ""
        value: ""
        usage: "What replaces --replace or the body of --section, empty to delete it"
        type: "string"
      - name: "all"
        shorthand: ""
        value: ""
        usage: "Replace every occurrence of --replace"
        type: "bool"
      - name: "restore-version"
        shorthand: ""
        value: ""
        usage: "Bring back the text of a version, by its uuid from show note --history"
        type: "string"
  edit-folder:
    use: "folder [<uuid|path>]"
    short: "Edit an existing folder"
    long: "Edit an existing folder. A form opens with the current title when no flag is given. --pin alone leaves the title as it is."
    example: "{name} edit folder <uuid> --title \"Projects\"\n{name} edit folder /Projects --pin"
    args:
      - name: "title"
        shorthand: "t"
        value: ""
        usage: "New title of the folder"
        type: "string"
      - name: "pin"
        shorthand: ""
        value: ""
        usage: "Make the folder a favorite"
        type: "bool"
      - name: "unpin"
        shorthand: ""
        value: ""
        usage: "Remove the folder from the favorites"
        type: "bool"
  edit-tag:
    use: "tag <value> <new value>"
    short: "Edit an existing tag"
    long: "Rename a tag in the text of every note carrying it. A name already taken is refused unless --merge folds the tag into it. --dry-run lists the notes it would rewrite and the lines that change, and writes nothing; --summary prints only their count."
    example: "{name} edit tag todo next\n{name} edit tag draft wip --merge --dry-run"
    args:
      - name: "merge"
        shorthand: ""
        value: ""
        usage: "Fold the tag into the new value when it is another tag already"
        type: "bool"
      - name: "dry-run"
        shorthand: ""
        value: ""
        usage: "Show the notes and the lines that would change, write nothing"
        type: "bool"
      - name: "summary"
        shorthand: ""
        value: ""
        usage: "Print only the count, not each note"
        type: "bool"
  delete:
    use: "remove"
    short: "Delete an existing note, folder, or tag, or revoke an API token"
  delete-note:
    use: "note"
    short: "Move notes to the trash"
    long: "Move notes to the trash. They are purged for good after the trash retention of the account, 30 days by default."
    example: "{name} remove note <uuid|path> [<uuid|path>...]"
  delete-folder:
    use: "folder"
    short: "Move folders and their content to the trash"
    long: "Move folders, their subfolders and notes to the trash. They are purged for good after the trash retention of the account, 30 days by default."
    example: "{name} remove folder <uuid|path> [<uuid|path>...]"
  delete-tag:
    use: "tag <value>..."
    short: "Delete an existing tag"
    long: "Delete tags and erase them from the text of every note carrying them; a note holding nothing else goes to the trash, unless --keep-empty. --dry-run counts the notes it would change, lists those it would trash, and writes nothing; --summary prints only the counts."
    example: "{name} remove tag draft old\n{name} remove tag inbox --dry-run --keep-empty"
    args:
      - name: "dry-run"
        shorthand: ""
        value: ""
        usage: "Show the notes that would change and go to the trash, write nothing"
        type: "bool"
      - name: "keep-empty"
        shorthand: ""
        value: ""
        usage: "Leave a note holding nothing but the tag empty instead of trashing it"
        type: "bool"
      - name: "summary"
        shorthand: ""
        value: ""
        usage: "Print only the counts, not the notes trashed"
        type: "bool"
  delete-token:
    use: "token <uuid>"
    short: "Revoke an API token of the account"
    long: "Revoke an API token: it stops working at once. Its uuid is in {name} show token."
    example: "{name} remove token 3f2a4b1c-0d9e-4a8b-9c7d-1e2f3a4b5c6d"
  move:
    use: "move <uuid|path>..."
    short: "Move existing notes or folders to a new location"
    long: "Move notes and folders into the folder given by --parent, or to the root without it."
    example: "{name} move <uuid> /Inbox/Ideas --parent /Projects"
    args:
      - name: "parent"
        shorthand: "p"
        value: ""
        usage: "UUID or path of the destination folder (root when not given)"
        type: "string"
      - name: "parent-from-list"
        shorthand: ""
        value: ""
        usage: "Pick the destination folder from a list"
        type: "bool"
  show-finder:
    use: "finder [<uuid|path>]"
    short: "Browse folders and notes"
    long: "Browse folders and notes from a folder (the root by default): open, edit, create, delete and filter them."
    example: "{name} finder\n{name} finder /Projects"
  show-graph:
    use: "graph [<uuid|path>]"
    short: "Walk the notes linked by [[links]] and the tags they share"
    long: "Center on a note to see its [[links]], its backlinks and the notes sharing its tags, most shared first, and move from note to note. Without a note, start from every note."
    example: "{name} graph\n{name} graph /Projects/Go/Ideas"
  trash:
    use: "trash"
    short: "List the removed notes and folders"
    long: "List what was removed, each removal once with what went with it, and when it is purged."
    example: "{name} trash\n{name} trash --json"
    args:
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  restore:
    use: "restore <uuid>..."
    short: "Take notes and folders out of the trash"
    long: "Take items out of the trash, with everything removed at the same time. An item whose folder is still in the trash cannot come back alone."
    example: "{name} restore <uuid> [<uuid>...]"
  replace:
    use: "replace <text> <by>"
    short: "Replace a text in every note"
    long: "Replace a plain text (no regex, case kept) by another in every note, or in a folder's with its subfolders, in one go; an empty <by> deletes it. Locked notes are left as they are. Ultra plan. --dry-run lists each note with its occurrences, the line before and after, and writes nothing; --summary prints only the counts; --json prints {notes, occurrences, locked, matches}."
    example: "{name} replace teh the --dry-run\n{name} replace \"old name\" \"new name\" --folder /Projects\n{name} replace draft \"\" --dry-run --summary --json"
    args:
      - name: "folder"
        shorthand: ""
        value: ""
        usage: "UUID or path of a folder: only its notes, subfolders included"
        type: "string"
      - name: "dry-run"
        shorthand: ""
        value: ""
        usage: "Show the notes and the occurrences that would change, write nothing"
        type: "bool"
      - name: "summary"
        shorthand: ""
        value: ""
        usage: "Print only the counts, not each note"
        type: "bool"
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  search:
    use: "search [text]"
    short: "Find notes by their title or content, tags and folder"
    long: "List the notes whose title or content contains the text (case-insensitive) and that match every filter given, title matches first, 50 of them unless --limit says otherwise. The text may be left out when a filter is given. Tags are named with or without #, the folder by its path or uuid. Enter opens a note. --duplicates and --same-path list the notes sharing a title or a path instead, and take no text nor filter."
    example: "{name} search recette\n{name} search \"pâte brisée\"\n{name} search --tag Idée --any-tag Cuisine --any-tag Boisson --not Étapes\n{name} search --folder /Archives --updated-before 2026-01-31\n{name} search --untagged --max-length 100\n{name} search --empty-sections --tag Recette\n{name} search recette --json\n{name} search recette --limit 0\n{name} search --duplicates\n{name} search --same-path --json"
    args:
      - name: "tag"
        shorthand: ""
        value: ""
        usage: "Tags the notes all carry, comma separated or repeated"
        type: "stringSlice"
      - name: "any-tag"
        shorthand: ""
        value: ""
        usage: "Tags the notes carry one of at least, comma separated or repeated"
        type: "stringSlice"
      - name: "no-tag"
        shorthand: ""
        value: ""
        usage: "Tags the notes carry none of, comma separated or repeated"
        type: "stringSlice"
      - name: "folder"
        shorthand: ""
        value: ""
        usage: "A folder, by path or uuid, its subfolders included"
        type: "string"
      - name: "not"
        shorthand: ""
        value: ""
        usage: "A text the title and content lack, any case"
        type: "string"
      - name: "max-length"
        shorthand: ""
        value: "0"
        usage: "At most that many characters, title line included, 0 for any length"
        type: "int"
      - name: "untagged"
        shorthand: ""
        value: ""
        usage: "Only the notes with no tag"
        type: "bool"
      - name: "empty-sections"
        shorthand: ""
        value: ""
        usage: "Only the notes with a heading followed by nothing, listed in --json"
        type: "bool"
      - name: "updated-before"
        shorthand: ""
        value: ""
        usage: "Changed before this day (2026-01-31) or RFC 3339 instant, oldest first without a text"
        type: "string"
      - name: "duplicates"
        shorthand: ""
        value: ""
        usage: "Instead of a search, the notes sharing a title anywhere, grouped"
        type: "bool"
      - name: "same-path"
        shorthand: ""
        value: ""
        usage: "Instead of a search, the notes sharing a path (one title in one folder), grouped"
        type: "bool"
      - name: "limit"
        shorthand: ""
        value: "50"
        usage: "How many notes at most, 0 for all of them"
        type: "int"
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  tag:
    use: "tag"
    short: "Tag notes in bulk"
  tag-notes:
    use: "notes [<uuid|path>...]"
    short: "Add or remove tags on notes, named or found by the filters of search"
    long: "Add and remove tags on the notes named, or on every note the filters of {name} search find (--text, --tag, --any-tag, --no-tag, --folder, --not, --max-length, --untagged, --empty-sections, --updated-before), only their #tags rewritten. Each note says what was added, already there, removed or absent. --dry-run shows that and the lines of text that change, and writes nothing. --summary prints only the counts and the notes that failed, with their error; with --json, {changed, unchanged, failed, notes} the failed ones only."
    example: "{name} tag notes /Projects/Plan /Inbox/Idea --add done --remove todo\n{name} tag notes --folder /Archives --updated-before 2026-01-31 --add obsolete --dry-run\n{name} tag notes --untagged --max-length 100 --add stub --json"
    args:
      - name: "add"
        shorthand: ""
        value: ""
        usage: "Tags to add, without #, comma separated or repeated"
        type: "stringSlice"
      - name: "remove"
        shorthand: ""
        value: ""
        usage: "Tags to remove, without #, comma separated or repeated"
        type: "stringSlice"
      - name: "text"
        shorthand: ""
        value: ""
        usage: "The text of {name} search: the notes whose title or content contains it"
        type: "string"
      - name: "dry-run"
        shorthand: ""
        value: ""
        usage: "Show the notes and the lines that would change, write nothing"
        type: "bool"
      - name: "summary"
        shorthand: ""
        value: ""
        usage: "Print only the counts and the notes that failed"
        type: "bool"
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  recent:
    use: "recent"
    short: "List the last changed notes"
    long: "List the last changed notes, most recent first. Enter opens a note."
    example: "{name} recent\n{name} recent --json"
    args:
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the result as JSON"
        type: "bool"
  export:
    use: "export <directory> [<uuid|path>]"
    short: "Write notes out as markdown files"
    long: "Write the notes of a folder (all of them without one) into a new or empty directory: a folder becomes a directory, a note a <title>.md file with its text. Links to notes are written back as [[Title]]."
    example: "{name} export ~/notes-backup\n{name} export ~/projets /Projects"
  import:
    use: "import <directory>"
    short: "Add markdown files as notes"
    long: "Add every .md file of a directory as a note, and its subdirectories as folders, all or nothing. Hidden files and other files are skipped; a text without a heading gets its file name as title. A folder name already taken in the same place stops the import."
    example: "{name} import ~/notes-backup --parent /Archive\n{name} import ~/Obsidian/vault"
    args:
      - name: "parent"
        shorthand: "p"
        value: ""
        usage: "UUID or path of the folder to import into (root when not given)"
        type: "string"
  serve:
    use: "serve"
    short: "Run the HTTP API"
    long: "Run the HTTP API. It has no authentication: keep it on the loopback. Web pages can only call it from --origin. Accounts are created by invitation of an admin, unless --add-user-mode=public. --mcp-addr also serves the MCP tools over HTTP to agents (the Claude app, ChatGPT), authenticated by an API token or OAuth. {NAME}_HOST_NAME and {NAME}_HOST_PASSWORD create the first account on an empty base."
    example: "{name}-server serve --origin http://localhost:3000"
    args:
      - name: "addr"
        shorthand: ""
        value: "127.0.0.1:8080"
        usage: "Address to listen on"
        type: "string"
      - name: "origin"
        shorthand: ""
        value: ""
        usage: "Origin of the web app allowed to call the API (none when empty)"
        type: "string"
      - name: "web"
        shorthand: ""
        value: ""
        usage: "Folder of the generated web app, served on the same address as the API (none when empty)"
        type: "string"
      - name: "published"
        shorthand: ""
        value: ""
        usage: "Address the API is published on, when not --addr (the host side of a container port): on the loopback, only a local proxy reaches it, and the client's address is read from X-Forwarded-For"
        type: "string"
      - name: "add-user-mode"
        shorthand: ""
        value: "invitation"
        usage: "How accounts are created: invitation (an admin invites or creates them) or public (anyone reaching the web app)"
        type: "string"
      - name: "mcp-addr"
        shorthand: ""
        value: ""
        usage: "Address to serve the MCP tools on, at /mcp, for agents holding an API token of the account or signed in with OAuth (none when empty): only /mcp and its OAuth endpoints are there, so a tunnel or proxy can open this address to the Internet without the API"
        type: "string"
      - name: "mcp-published"
        shorthand: ""
        value: ""
        usage: "Address the MCP is published on, when not --mcp-addr (the host side of a container port): on the loopback, only a local tunnel reaches it, and the client's address is read from X-Forwarded-For"
        type: "string"
  mcp:
    use: "mcp"
    short: "Serve the account's notes to an agent (MCP, stdio)"
    long: "Serve the notes of the logged-in account to an agent over MCP on stdin and stdout: search, read, create, edit, move, trash and restore. It is a client of the API like the rest of the CLI, listens on no port, and acts on the server and for the account of this CLI session ({name} login, or {NAME}_URL and {NAME}_SESSION)."
    example: "{name} mcp"
  login:
    use: "login <url>"
    short: "Log the CLI in to an account on a server"
    long: "Ask the account's name and password, log in on the server at <url>: the address of the web app (the server's WEB_ORIGIN), or http://127.0.0.1:8080 on the server itself (its TIDE_LISTEN). Then keep the server and the session in ~/.config/{name}/session.json (readable by the user only). Every other command then acts for this account. With --print-token, print a new session token instead and keep nothing: an agent that cannot log in where it runs gets it through {NAME}_SESSION, and the server through {NAME}_URL, which win over the file. The token opens the whole account."
    example: "{name} login https://notes.example.ts.net\n{name} login http://127.0.0.1:8080\nexport {NAME}_SESSION=$({name} login https://notes.example.ts.net --print-token)"
    args:
      - name: "print-token"
        shorthand: ""
        value: ""
        usage: "Print a new session token for {NAME}_SESSION instead of keeping it"
        type: "bool"
  logout:
    use: "logout"
    short: "Log the CLI out, on the server too"
  whoami:
    use: "whoami"
    short: "Show the account and the server the CLI acts for"
    example: "{name} whoami\n{name} whoami --json"
    args:
      - name: "json"
        shorthand: ""
        value: ""
        usage: "Display the account and its server as JSON"
        type: "bool"
  user:
    use: "user"
    short: "Manage the accounts"
  user-add:
    use: "add <name>"
    short: "Create an account"
    long: "Create an account; the password is asked twice, or read from stdin with --password-stdin."
    example: "{name}-server user add cyril\necho \"$PASSWORD\" | {name}-server user add cyril --password-stdin"
    args:
      - name: "password-stdin"
        shorthand: ""
        value: ""
        usage: "Read the password from the first line of stdin"
        type: "bool"
  user-perf:
    use: "perf <name> [notes]"
    short: "Create an account of generated notes, to measure the app at scale (hidden)"
    long: "Create the account with [notes] generated notes (50000 by default): one big folder and 30 small ones, 1 to 4 tags per note among 150 on a Zipf law, a few [[links]]. Nothing is done when the account exists. The password is read from stdin with --password-stdin. Used by make perf."
    example: "echo perf-password | {name}-server user perf perf --password-stdin"
    args:
      - name: "password-stdin"
        shorthand: ""
        value: ""
        usage: "Read the password from the first line of stdin"
        type: "bool"
  user-reset-password:
    use: "reset-password <name>"
    short: "Give an account a new password"
    long: "Give an account a new password, for a forgotten one, and log all its devices out: the way back in when no admin can log in any more."
    example: "{name}-server user reset-password cyril"
    args:
      - name: "password-stdin"
        shorthand: ""
        value: ""
        usage: "Read the password from the first line of stdin"
        type: "bool"
  rotate-secret:
    use: "rotate-secret"
    short: "Seal the keys of the accounts by a new {NAME}_SECRET"
    long: "Seal the key of every account, sealed by {NAME}_OLD_SECRET, by {NAME}_SECRET instead. Put the new secret in {NAME}_SECRET and the old one in {NAME}_OLD_SECRET, after make backup; the notes are not rewritten. Then the same {NAME}_SECRET goes in .env.docker, and make api."
    example: "{NAME}_OLD_SECRET=<old> {name}-server rotate-secret"
  account:
    use: "account"
    short: "Manage the account logged in"
  account-purge:
    use: "purge"
    short: "Delete every note, folder, tag, image, snippet and saved search of the account"
    long: "Delete for good every note, folder, tag and image of the account logged in, the trash included, and empty its snippets and saved searches. The account and its other settings stay. Type the account's name to confirm."
    example: "{name} account purge"
  root:
    short: "The root of the notes system"
    long: "The root of the {name} system, used to access the main functionality. A client of the API of a {name}-server: {name} login <url> first."
  server-root:
    use: "{name}-server"
    short: "The server of the notes system"
    long: "The server of the {name} system: the API and the web app, and the commands of its admin, on the base."
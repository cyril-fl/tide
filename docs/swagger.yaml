components:
  schemas:
    addinvite.Result:
      properties:
        invite:
          $ref: '#/components/schemas/domain.Invite'
        token:
          type: string
      required:
      - invite
      - token
      type: object
    adduser.Input:
      properties:
        invite:
          description: 'The token of an invitation to consume, none when empty: the
            CLI, an admin, or the first account of a base.'
          type: string
        name:
          type: string
        password:
          type: string
      required:
      - name
      - password
      type: object
    countnotes.Stats:
      properties:
        notes:
          type: integer
        size:
          description: 'items, texts and versions, the trash included: what the base
            keeps'
          type: integer
      required:
      - notes
      - size
      type: object
    counttags.TagCount:
      properties:
        notes:
          type: integer
        value:
          type: string
      required:
      - notes
      - value
      type: object
    createapitoken.Input:
      properties:
        expires_in:
          description: ExpiresIn is how long the token works, 90d when left out.
          enum:
          - 7d
          - 30d
          - 90d
          - 1y
          - never
          type: string
        name:
          type: string
        read_only:
          description: ReadOnly makes a token that reads the notes and changes nothing.
          type: boolean
      required:
      - name
      type: object
    createapitoken.Result:
      properties:
        api_token:
          $ref: '#/components/schemas/domain.APIToken'
        token:
          type: string
      required:
      - api_token
      - token
      type: object
    createfolder.Input:
      properties:
        parent_id:
          type: string
        title:
          type: string
      required:
      - title
      type: object
    createnote.Input:
      properties:
        content:
          type: string
        parent_id:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - content
      type: object
    createsession.Input:
      properties:
        name:
          type: string
        password:
          type: string
        token:
          description: 'Token asks the token in the answer too, for a client without
            cookies (the CLI): the web keeps it HttpOnly.'
          type: boolean
      required:
      - name
      - password
      type: object
    createsession.Result:
      properties:
        expires_at:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/domain.User'
      required:
      - expires_at
      - user
      type: object
    createtag.Body:
      properties:
        values:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - values
      type: object
    deleteitems.Body:
      properties:
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - ids
      type: object
    deletetag.Body:
      properties:
        values:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - values
      type: object
    domain.APIToken:
      properties:
        created_at:
          type: string
        expires_at:
          description: no limit when absent
          type: string
        id:
          type: string
        last_used_at:
          description: never used when absent
          type: string
        name:
          description: 'sealed: a stolen base does not tell what the tokens are for'
          type: string
        oauth:
          description: |-
            OAuth marks the connection of an OAuth client (the MCP over HTTP): Name is the client's, ExpiresAt the end of its
            refresh token, 90 days after its last use. TokenHash is then its access token, valid until AccessExpiresAt only.
          type: boolean
        read_only:
          description: ReadOnly refuses the token every request that changes something
            (auth), and the MCP its writing tools.
          type: boolean
      required:
      - created_at
      - id
      - name
      - oauth
      - read_only
      type: object
    domain.File:
      properties:
        content_type:
          type: string
        created_at:
          type: string
        id:
          type: string
        name:
          description: '"" (NULL) for the images uploaded before names were sealed'
          type: string
        size:
          type: integer
      required:
      - content_type
      - created_at
      - id
      - name
      - size
      type: object
    domain.Invite:
      properties:
        created_at:
          type: string
        created_by:
          description: the admin who made it
          type: string
        expires_at:
          type: string
        id:
          type: string
        token:
          description: |-
            The token itself, sealed with the key of the admin who made it, so the admin panel shows the link again:
            "" (NULL) for the invitations made before it was kept. The sign-up still finds an invitation by TokenHash.
          type: string
      required:
      - created_at
      - created_by
      - expires_at
      - id
      - token
      type: object
    domain.Item:
      properties:
        created_at:
          type: string
        has_folders:
          description: a folder with subfolders, read by listitems
          type: boolean
        id:
          type: string
        kind:
          $ref: '#/components/schemas/domain.Kind'
        parent_id:
          type: string
        readonly:
          description: a locked note, read by listitems from metadata_notes
          type: boolean
        title:
          description: NULL = untitled note (--no-title)
          type: string
        updated_at:
          type: string
      required:
      - created_at
      - id
      - kind
      - title
      type: object
    domain.Kind:
      enum:
      - folder
      - note
      type: string
      x-enum-varnames:
      - FOLDER
      - NOTE
    domain.NoteVersion:
      properties:
        conflict:
          description: a text refused by a 409, kept so it is not lost (#78)
          type: boolean
        content:
          description: left out of a list
          type: string
        created_at:
          type: string
        id:
          type: string
      required:
      - conflict
      - created_at
      - id
      type: object
    domain.SavedSearch:
      properties:
        created_from:
          type: string
        created_to:
          type: string
        edited_from:
          type: string
        edited_to:
          type: string
        folder_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        folder_mode:
          description: '"include" or "exclude", one of FolderModes'
          type: string
        id:
          type: string
        name:
          type: string
        tag_ids:
          items:
            type: string
          type: array
          uniqueItems: false
        tag_mode:
          description: '"any" (default) or "all", one of TagModes'
          type: string
        text:
          type: string
      required:
      - id
      - name
      type: object
    domain.SidebarSection:
      properties:
        id:
          type: string
        shown:
          type: boolean
      required:
      - id
      - shown
      type: object
    domain.Snippet:
      properties:
        content:
          type: string
        name:
          type: string
      required:
      - content
      - name
      type: object
    domain.Tag:
      properties:
        id:
          type: string
        value:
          type: string
      required:
      - id
      - value
      type: object
    domain.User:
      properties:
        admin:
          description: may create, invite and delete accounts; the first account of
            the base gets it
          type: boolean
        after_merge:
          description: what a merge does with the fork, one of AfterMerges
          type: string
        avatar:
          description: the id of a File of the account, purgefiles keeps it
          type: string
        color_mode:
          description: light or dark, one of ColorModes
          type: string
        created_at:
          type: string
        features:
          description: 'The features of its plan, what the web app shows: not stored,
            filled from Plan at every read.'
          items:
            type: string
          type: array
          uniqueItems: false
        id:
          type: string
        locale:
          description: the language of the web app, one of Locales
          type: string
        name:
          description: unique case-insensitive, see createschema
          type: string
        neighbors_limit:
          description: |-
            The most notes sharing a tag that a note shows around it, one of NeighborsLimits, 0 for all of them.
            An insert of 0 gets the default: only an update sets it.
          type: integer
        plan:
          description: the features of the web app, one of Plans
          type: string
        saved_searches:
          items:
            $ref: '#/components/schemas/domain.SavedSearch'
          type: array
          uniqueItems: false
        sidebar_sections:
          description: The order of the sidebar lists and which ones show, [] for
            the app's default.
          items:
            $ref: '#/components/schemas/domain.SidebarSection'
          type: array
          uniqueItems: false
        snippets:
          items:
            $ref: '#/components/schemas/domain.Snippet'
          type: array
          uniqueItems: false
        theme:
          description: the colors of the web app, one of Themes
          type: string
        trash_retention_days:
          description: 'Days before the trash is purged, 0 to never purge. An insert
            of 0 gets the default: only an update sets it.'
          type: integer
        view:
          description: how the web app lists items, one of Views
          type: string
      required:
      - admin
      - after_merge
      - avatar
      - color_mode
      - created_at
      - features
      - id
      - locale
      - name
      - neighbors_limit
      - plan
      - saved_searches
      - sidebar_sections
      - snippets
      - theme
      - trash_retention_days
      - view
      type: object
    editfolder.Body:
      properties:
        pinned:
          type: boolean
        title:
          type: string
      type: object
    editnote.Body:
      properties:
        content:
          type: string
        pinned:
          type: boolean
        readonly:
          type: boolean
        restore:
          description: 'Restore says the content is a version restored: the text it
            replaces is kept in the history.'
          type: boolean
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        updated_at:
          description: 'UpdatedAt is updated_at as read, or created_at for a note
            never edited: a 409 if the note changed since.'
          type: string
      type: object
    editpassword.Input:
      properties:
        current:
          type: string
        new:
          type: string
      required:
      - current
      - new
      type: object
    edittag.Body:
      properties:
        value:
          type: string
      required:
      - value
      type: object
    edituser.Input:
      properties:
        after_merge:
          description: one of domain.AfterMerges
          type: string
        avatar:
          description: the id of an image of the account, "" for none
          type: string
        color_mode:
          type: string
        locale:
          type: string
        name:
          type: string
        neighbors_limit:
          description: one of domain.NeighborsLimits
          type: integer
        plan:
          type: string
        saved_searches:
          description: the whole list, it replaces the saved one
          items:
            $ref: '#/components/schemas/domain.SavedSearch'
          type: array
          uniqueItems: false
        sidebar_sections:
          description: the whole list, in order
          items:
            $ref: '#/components/schemas/domain.SidebarSection'
          type: array
          uniqueItems: false
        snippets:
          description: the whole list, it replaces the saved one
          items:
            $ref: '#/components/schemas/domain.Snippet'
          type: array
          uniqueItems: false
        theme:
          type: string
        trash_retention_days:
          type: integer
        view:
          type: string
      type: object
    forcelayout.Point:
      properties:
        x:
          type: number
        "y":
          type: number
      required:
      - x
      - "y"
      type: object
    forknote.Body:
      properties:
        content:
          type: string
      required:
      - content
      type: object
    forknote.MergeBody:
      properties:
        base:
          description: Base is the fork's text the merge started from, the base of
            the next merge.
          type: string
        content:
          description: Content is the merged text, saved into the original.
          type: string
        trash:
          description: Trash moves the fork to the trash with the merge.
          type: boolean
        updated_at:
          description: 'UpdatedAt is updated_at of the original as read, or its created_at:
            a 409 if it changed since.'
          type: string
      required:
      - base
      - content
      type: object
    forknote.RebaseBody:
      properties:
        base:
          description: Base is the original's text the rebase started from, the base
            of the next merge.
          type: string
        content:
          description: Content is the rebased text, saved into the fork.
          type: string
        updated_at:
          description: 'UpdatedAt is updated_at of the fork as read, or its created_at:
            a 409 if it changed since.'
          type: string
      required:
      - base
      - content
      type: object
    importnotes.Result:
      properties:
        folders:
          type: integer
        notes:
          type: integer
      required:
      - folders
      - notes
      type: object
    listbrokenlinks.Link:
      properties:
        kind:
          enum:
          - unresolved
          - ambiguous
          - missing
          - file
          type: string
        note_id:
          type: string
        note_path:
          type: string
        note_title:
          type: string
        target:
          type: string
      required:
      - kind
      - note_id
      - note_path
      - note_title
      - target
      type: object
    listfolders.Folder:
      properties:
        id:
          type: string
        path:
          type: string
      required:
      - id
      - path
      type: object
    listpinned.Pinned:
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/domain.Kind'
        path:
          type: string
        readonly:
          type: boolean
        title:
          type: string
      required:
      - id
      - kind
      - path
      - title
      type: object
    listrecent.Recent:
      properties:
        id:
          type: string
        path:
          type: string
        readonly:
          type: boolean
        title:
          type: string
        updated_at:
          type: string
      required:
      - id
      - path
      - title
      - updated_at
      type: object
    listtrash.Trashed:
      properties:
        deleted_at:
          type: string
        id:
          type: string
        inside:
          type: integer
        kind:
          $ref: '#/components/schemas/domain.Kind'
        title:
          type: string
      required:
      - deleted_at
      - id
      - inside
      - kind
      - title
      type: object
    moveitems.Input:
      properties:
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
        parent_id:
          type: string
      required:
      - ids
      type: object
    readfork.Result:
      properties:
        base:
          type: string
        fork_of:
          type: string
        merged_at:
          description: 'MergedAt is the version of the original the last merge saved,
            until that merge is undone: unmergefork''s 409.'
          type: string
      required:
      - base
      - fork_of
      type: object
    readgraph.Link:
      properties:
        source:
          type: string
        strength:
          type: number
        target:
          type: string
      required:
      - source
      - target
      type: object
    readgraph.Note:
      properties:
        id:
          type: string
        path:
          type: string
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
        title:
          type: string
        x:
          type: number
        "y":
          type: number
      required:
      - id
      - path
      - title
      type: object
    readgraph.Result:
      properties:
        links:
          items:
            $ref: '#/components/schemas/readgraph.Link'
          type: array
          uniqueItems: false
        notes:
          items:
            $ref: '#/components/schemas/readgraph.Note'
          type: array
          uniqueItems: false
        tag_positions:
          additionalProperties:
            $ref: '#/components/schemas/forcelayout.Point'
          type: object
        tag_weights:
          additionalProperties:
            type: number
          type: object
      required:
      - links
      - notes
      type: object
    readitem.Result:
      properties:
        children:
          items:
            $ref: '#/components/schemas/domain.Item'
          type: array
          uniqueItems: false
        content:
          type: string
        fork_of:
          description: 'a fork: the note it merges back into'
          type: string
        item:
          $ref: '#/components/schemas/domain.Item'
        path:
          type: string
        pinned:
          type: boolean
        readonly:
          description: 'locked: PATCH refuses its content and tags'
          type: boolean
        tags:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - item
      - path
      type: object
    readneighbors.Linked:
      properties:
        id:
          type: string
        path:
          type: string
        snippet:
          type: string
        title:
          type: string
      required:
      - id
      - path
      - title
      type: object
    readneighbors.Neighbor:
      properties:
        id:
          type: string
        path:
          type: string
        shared:
          type: integer
        tags:
          description: read as ids, shown as values
          items:
            type: string
          type: array
          uniqueItems: false
        title:
          type: string
      required:
      - id
      - path
      - shared
      - tags
      - title
      type: object
    readneighbors.Result:
      properties:
        backlinks:
          items:
            $ref: '#/components/schemas/readneighbors.Linked'
          type: array
          uniqueItems: false
        forks:
          items:
            $ref: '#/components/schemas/readneighbors.Linked'
          type: array
          uniqueItems: false
        links:
          items:
            $ref: '#/components/schemas/readneighbors.Linked'
          type: array
          uniqueItems: false
        mentions:
          description: Mentions are the notes citing the title as a whole word without
            a [[link]] to the note, the latest edited first.
          items:
            $ref: '#/components/schemas/readneighbors.Linked'
          type: array
          uniqueItems: false
        merged:
          description: Merged is the fork whose last merge into the note can still
            be undone (the note unchanged since), live or in the trash the merge put
            it in.
          type: string
        neighbors:
          items:
            $ref: '#/components/schemas/readneighbors.Neighbor'
          type: array
          uniqueItems: false
        neighbors_total:
          type: integer
        note:
          $ref: '#/components/schemas/readitem.Result'
        original:
          description: 'a fork: the live note it merges back into, else empty'
          items:
            $ref: '#/components/schemas/readneighbors.Linked'
          type: array
          uniqueItems: false
      required:
      - backlinks
      - forks
      - links
      - mentions
      - neighbors
      - neighbors_total
      - note
      - original
      type: object
    readnotetags.Body:
      properties:
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - ids
      type: object
    readpath.Resolved:
      properties:
        id:
          type: string
      required:
      - id
      type: object
    readplans.Plan:
      properties:
        features:
          items:
            type: string
          type: array
          uniqueItems: false
        id:
          type: string
      required:
      - features
      - id
      type: object
    readtag.Note:
      properties:
        created_at:
          type: string
        id:
          type: string
        path:
          type: string
        readonly:
          type: boolean
        title:
          type: string
        updated_at:
          type: string
      required:
      - created_at
      - id
      - path
      - title
      type: object
    readtag.Result:
      properties:
        notes:
          items:
            $ref: '#/components/schemas/readtag.Note'
          type: array
          uniqueItems: false
        tag:
          $ref: '#/components/schemas/domain.Tag'
      required:
      - notes
      - tag
      type: object
    readversions.Body:
      properties:
        content:
          type: string
      required:
      - content
      type: object
    replacenotes.Input:
      properties:
        dry_run:
          type: boolean
        find:
          type: string
        folder:
          description: 'a folder id: only its notes, its subfolders included'
          type: string
        replace:
          type: string
      required:
      - find
      - replace
      type: object
    replacenotes.Result:
      properties:
        locked:
          type: integer
        notes:
          type: integer
        occurrences:
          type: integer
      required:
      - locked
      - notes
      - occurrences
      type: object
    respond.Failure:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    restore.Body:
      properties:
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - ids
      type: object
    runsavedsearch.Match:
      properties:
        id:
          type: string
        path:
          type: string
        readonly:
          type: boolean
        snippet:
          type: string
        title:
          type: string
      required:
      - id
      - path
      - snippet
      - title
      type: object
    searchnotes.Match:
      properties:
        id:
          type: string
        path:
          type: string
        readonly:
          type: boolean
        snippet:
          type: string
        title:
          type: string
      required:
      - id
      - path
      - snippet
      - title
      type: object
    users.Account:
      properties:
        admin:
          type: boolean
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
      required:
      - admin
      - created_at
      - id
      - name
      type: object
    users.Mode:
      properties:
        allowed:
          description: |-
            Whether the sign-up page may create an account right now: the mode is public, the base has no account yet
            (it is waiting for its host), or the invitation given is good.
          type: boolean
        mode:
          description: one of domain.AddUserModes
          type: string
      required:
      - allowed
      - mode
      type: object
    users.Reset:
      properties:
        password:
          type: string
      required:
      - password
      type: object
    users.Version:
      properties:
        version:
          type: string
      required:
      - version
      type: object
externalDocs:
  description: ""
  url: ""
info:
  title: Tide API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/add-user:
    get:
      parameters:
      - description: token of an invitation
        in: query
        name: invite
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users.Mode'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Whether an account can be created
      tags:
      - account
  /api/export:
    get:
      parameters:
      - description: items to export with what they hold, every note when left out
        in: query
        name: id
        schema:
          items:
            type: string
          type: array
        style: form
      - description: folder whose content to export, without the folder itself
        in: query
        name: parent
        schema:
          type: string
      - description: 'false: the images in _files are empty, only named'
        in: query
        name: files
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/zip:
              schema:
                type: file
          description: OK
        "400":
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Bad Request
        "404":
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Not Found
        "500":
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/respond.Failure'
          description: Internal Server Error
      summary: Export the notes as markdown files
      tags:
      - transfer
  /api/files:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/domain.File'
                type: array
          description: OK
        "403":
          content:
            application/json:
              schema:
